<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edc22e"/>
      <stop offset="100%" stop-color="#f59563"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="40" y="40" width="432" height="432" rx="80" fill="#bbada0" fill-opacity="0.35"/>
  <g filter="url(#shadow)">
    <!-- 2x2 mini grid preview -->
    <rect x="76" y="76" width="160" height="160" rx="24" fill="#eee4da"/>
    <text x="156" y="180" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#776e65" text-anchor="middle">2</text>
    
    <rect x="276" y="76" width="160" height="160" rx="24" fill="#ede0c8"/>
    <text x="356" y="180" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#776e65" text-anchor="middle">0</text>
    
    <rect x="76" y="276" width="160" height="160" rx="24" fill="#f2b179"/>
    <text x="156" y="380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#f9f6f2" text-anchor="middle">4</text>
    
    <rect x="276" y="276" width="160" height="160" rx="24" fill="#edc22e"/>
    <text x="356" y="380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#f9f6f2" text-anchor="middle">8</text>
  </g>
</svg>
